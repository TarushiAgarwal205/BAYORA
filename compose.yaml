services:
  gateway:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      BAYORA_HOST: "0.0.0.0"
      BAYORA_PORT: "8000"
      BAYORA_BLUE_SERVICE_URL: "http://blue:8001"
      BAYORA_BLUE_SERVICE_TOKEN: ${BAYORA_BLUE_SERVICE_TOKEN:?Set BAYORA_BLUE_SERVICE_TOKEN in .env}
      BAYORA_GATEWAY_RED_TOKEN: ${BAYORA_GATEWAY_RED_TOKEN:-}
      BAYORA_GATEWAY_BLUE_TOKEN: ${BAYORA_GATEWAY_BLUE_TOKEN:-}
      BAYORA_GATEWAY_ADMIN_TOKEN: ${BAYORA_GATEWAY_ADMIN_TOKEN:-}
      BAYORA_AUDIT_DB: /app/data/bayora_audit.sqlite3
      BAYORA_AUDIT_CHECKPOINT_PATH: /app/audit-checkpoint/checkpoint.sqlite3
      BAYORA_AUDIT_CHECKPOINT_KEY: ${BAYORA_AUDIT_CHECKPOINT_KEY:?Set BAYORA_AUDIT_CHECKPOINT_KEY in .env}
      BAYORA_SECURITY_CONFIG: /app/data/security-config.json
      BAYORA_LLM_SERVICE_URL: "http://llm:8002"
      BAYORA_LLM_SERVICE_TOKEN: ${BAYORA_LLM_SERVICE_TOKEN:?Set BAYORA_LLM_SERVICE_TOKEN in .env}
      BAYORA_LLM_MODEL: ${BAYORA_LLM_MODEL:-openrouter/free}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - audit-checkpoint:/app/audit-checkpoint
      - ./policies:/app/policies
      - ./reports/red-runs:/app/reports/red-runs
    depends_on:
      blue:
        condition: service_healthy
      llm:
        condition: service_healthy
    networks:
      - red-gateway
      - blue-gateway
      - llm-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5

  blue:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - blue.service:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      BAYORA_BLUE_SERVICE_TOKEN: ${BAYORA_BLUE_SERVICE_TOKEN:?Set BAYORA_BLUE_SERVICE_TOKEN in .env}
    expose:
      - "8001"
    networks:
      - blue-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5

  llm:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - llm.service:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      BAYORA_OPENROUTER_API_KEY: ${BAYORA_OPENROUTER_API_KEY:-}
      BAYORA_LLM_MODEL: ${BAYORA_LLM_MODEL:-openrouter/free}
      BAYORA_LLM_SERVICE_TOKEN: ${BAYORA_LLM_SERVICE_TOKEN:?Set BAYORA_LLM_SERVICE_TOKEN in .env}
    expose:
      - "8002"
    networks:
      - llm-gateway
      - llm-egress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5

  red:
    build: .
    command:
      - python
      - -m
      - red.runner
      - run
      - --gateway-url
      - "http://gateway:8000"
      - --case
      - denied-red-resource-read
      - --case
      - invalid-test-identifier
      - --case
      - policy-denied-llm-generation
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      BAYORA_GATEWAY_RED_TOKEN: ${BAYORA_GATEWAY_RED_TOKEN:?Set BAYORA_GATEWAY_RED_TOKEN in .env}
    volumes:
      - ./reports/red-runs:/app/reports/red-runs
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - red-gateway

networks:
  red-gateway:
    internal: true

  blue-gateway:
    internal: true

  llm-gateway:
    internal: true

  llm-egress:
    driver: bridge

volumes:
  audit-checkpoint:
